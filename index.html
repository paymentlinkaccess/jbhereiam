<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#050505">

  <title>JB | Private Collections</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Anton&family=Cinzel:wght@500;600;700&family=Inter:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="packages.css">
</head>


<body>

  <main class="storefront">


    <!-- =========================================
         HERO IMAGE
    ========================================== -->

    <section class="hero">

      <img
        src="jb-main.png"
        alt="JB Private Collections"
      >

    </section>



    <!-- =========================================
         SMALL NAVIGATION BAR
    ========================================== -->

    <nav class="mini-nav">

      <span>
        ▣ &nbsp; PHOTOS
      </span>

      <i></i>

      <span>
        ▰ &nbsp; VIDEOS
      </span>

      <i></i>

      <span>
        ♦ &nbsp; RECENTLY ADDED
      </span>

    </nav>



    <!-- =========================================
         PACKAGE HEADING
    ========================================== -->

    <header class="package-heading">

      <h1>
        CHOOSE YOUR PACKAGE
      </h1>

      <p>
        GET EXCLUSIVE ACCESS TO JB'S PRIVATE CONTENT
      </p>

    </header>



    <!-- =========================================
         PACKAGES

         JavaScript automatically inserts
         all five packages here.
    ========================================== -->

    <section
      id="packageList"
      class="package-list"
    ></section>



    <!-- =========================================
         FOOTER
    ========================================== -->

    <footer class="store-footer">

      <span>SECURE PAYMENT</span>

      <b>•</b>

      <span>PRIVATE CONTENT</span>

      <b>•</b>

      <span>MOBILE FRIENDLY</span>

    </footer>


  </main>



  <!-- PACKAGE INFORMATION -->

  <script src="package-config.js"></script>


  <!-- BUILDS PACKAGE CARDS -->

  <script src="packages-page.js"></script>


</body>

</html>
