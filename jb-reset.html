<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090909"><title>JB | Reset Password</title><link rel="stylesheet" href="./jb-feed.css?v=20261017-2"></head><body><header class="top"><a class="brand" href="./index.html">JB<span>.</span></a><nav><a href="./jb-admin.html">UPLOAD STUDIO</a></nav></header><main><section class="hero"><p class="eyebrow">JB PRIVATE COLLECTIONS</p><h1>RESET <em>PASSWORD.</em></h1></section><section class="panel"><p id="status" role="status">Checking your reset link…</p><form id="resetForm" hidden><label>NEW PASSWORD<input id="newPassword" type="password" minlength="8" autocomplete="new-password" required></label><button type="submit">SAVE NEW PASSWORD →</button></form><p><a href="./jb-admin.html">RETURN TO UPLOAD STUDIO</a></p></section></main><script type="module">import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';import {JB_FEED_CONFIG as C} from './jb-feed-config.js';const client=createClient(C.supabaseUrl,C.supabasePublishableKey);const status=document.getElementById('status'),form=document.getElementById('resetForm');let recovery=false;client.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'){recovery=true;form.hidden=false;status.textContent='Enter your new password.'}});async function initialize(){const url=new URL(location.href);const code=url.searchParams.get('code');if(code){const {error}=await client.auth.exchangeCodeForSession(code);if(error){status.textContent='This reset link has expired or is invalid. Request a new one from Upload Studio.';return}recovery=true;form.hidden=false;status.textContent='Enter your new password.';history.replaceState(null,'',location.pathname);return}const hash=new URLSearchParams(location.hash.slice(1));if(hash.get('error')){status.textContent=hash.get('error_description')||'Reset link expired.';return}if(hash.get('type')==='recovery'&&hash.get('access_token')){const {error}=await client.auth.setSession({access_token:hash.get('access_token'),refresh_token:hash.get('refresh_token')||''});if(error){status.textContent=error.message;return}recovery=true;form.hidden=false;status.textContent='Enter your new password.';history.replaceState(null,'',location.pathname);return}setTimeout(()=>{if(!recovery&&form.hidden)status.textContent='Open the password-reset link sent to your email. If it opens Private Gallery, check the Supabase redirect allowlist and request a fresh link.'},800)}form.addEventListener('submit',async e=>{e.preventDefault();if(!recovery){status.textContent='Please use a valid password-reset email link.';return}const button=form.querySelector('button');button.disabled=true;const {error}=await client.auth.updateUser({password:document.getElementById('newPassword').value});button.disabled=false;if(error){status.textContent=error.message;return}form.hidden=true;status.textContent='Password updated. You can now sign in to JB Upload Studio.';await client.auth.signOut()});initialize();</script></body></html>
