<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#050505">

  <title>JB | Private Gallery</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Anton&family=Cinzel:wght@500;600;700&family=Inter:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="styles.css">
</head>


<body class="gallery-page">


  <!-- ==========================================
       TOP NAVIGATION
  =========================================== -->

  <header class="gallery-nav">

    <a class="gallery-brand" href="index.html">
      JB<span>.</span>
    </a>

    <nav>
      <a href="#recent">Recently Added</a>
      <a href="#photos">Photos</a>
      <a href="#videos">Videos</a>
    </nav>

  </header>



  <!-- ==========================================
       HERO
  =========================================== -->

  <section class="gallery-package-hero">

    <img
      src="jb-main.png"
      alt="JB Private Collections"
      class="gallery-logo-image"
    >

    <div class="gallery-package-overlay">

      <div class="gallery-eyebrow">
        PRIVATE COLLECTION
      </div>

      <h1 id="packageTitle">
        JB PRIVATE GALLERY
      </h1>

      <p id="packageDetails">
        Exclusive Photos & Videos
      </p>

      <div
        id="packageBadge"
        class="gallery-package-badge"
      ></div>

    </div>

  </section>



  <!-- ==========================================
       RECENTLY ADDED
  =========================================== -->

  <section
    id="recent"
    class="gallery-section"
  >

    <div class="gallery-section-heading">

      <span>
        NEW
      </span>

      <h2>
        RECENTLY ADDED
      </h2>

    </div>


    <div
      id="recentGrid"
      class="recent-grid"
    ></div>

  </section>



  <!-- ==========================================
       PHOTOS
  =========================================== -->

  <section
    id="photos"
    class="gallery-section"
  >

    <div class="gallery-section-heading">

      <span>
        JB
      </span>

      <h2>
        PHOTOS
      </h2>

    </div>


    <div
      id="photoGallery"
      class="photo-masonry"
    ></div>

  </section>



  <!-- ==========================================
       VIDEOS
  =========================================== -->

  <section
    id="videos"
    class="gallery-section"
  >

    <div class="gallery-section-heading">

      <span>
        WATCH
      </span>

      <h2>
        VIDEOS
      </h2>

    </div>


    <div
      id="videoGallery"
      class="video-gallery"
    ></div>

  </section>



  <!-- ==========================================
       PHOTO LIGHTBOX
  =========================================== -->

  <div
    id="photoLightbox"
    class="media-lightbox"
    aria-hidden="true"
  >

    <button
      id="closePhoto"
      class="lightbox-close"
      type="button"
      aria-label="Close photo"
    >
      ×
    </button>


    <button
      id="previousPhoto"
      class="lightbox-arrow lightbox-previous"
      type="button"
      aria-label="Previous photo"
    >
      ‹
    </button>


    <img
      id="lightboxImage"
      src=""
      alt="Gallery photo"
    >


    <button
      id="nextPhoto"
      class="lightbox-arrow lightbox-next"
      type="button"
      aria-label="Next photo"
    >
      ›
    </button>

  </div>



  <!-- ==========================================
       VIDEO LIGHTBOX
  =========================================== -->

  <div
    id="videoLightbox"
    class="media-lightbox"
    aria-hidden="true"
  >

    <button
      id="closeVideo"
      class="lightbox-close"
      type="button"
      aria-label="Close video"
    >
      ×
    </button>


    <video
      id="lightboxVideo"
      controls
      playsinline
      preload="metadata"
    ></video>

  </div>



  <!-- ==========================================
       INVALID PACKAGE
  =========================================== -->

  <div
    id="invalidPackage"
    class="invalid-package"
    hidden
  >

    <div>

      <h2>
        GALLERY NOT FOUND
      </h2>

      <p>
        This gallery link is not valid.
      </p>

      <a href="index.html">
        VIEW PACKAGES
      </a>

    </div>

  </div>



  <!-- ==========================================
       FOOTER
  =========================================== -->

  <footer class="gallery-footer">

    <div class="gallery-footer-logo">
      JB
    </div>

    <p>
      PRIVATE COLLECTIONS
    </p>

  </footer>



  <!-- PACKAGE INFORMATION -->

  <script src="gallery-config.js"></script>


  <!-- GALLERY ENGINE -->

  <script src="gallery.js"></script>


</body>

</html>
